schema_version: 1

context:
  name: snowflake-sqlalchemy
  version: "1.11.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/snowflake_sqlalchemy-${{ version }}.tar.gz
  sha256: 942b203de0404b79550c4098ca851aee2b0b22f695426b073e58d71772e38d51

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - sqlalchemy >=1.4.19
    - snowflake-connector-python <5.0.0

tests:
  - python:
      imports:
        - snowflake.sqlalchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Snowflake SQLAlchemy Dialect
  homepage: https://github.com/snowflakedb/snowflake-sqlalchemy

extra:
  recipe-maintainers:
    - xhochy
    - xylar
