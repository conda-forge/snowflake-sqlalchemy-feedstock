schema_version: 1

context:
  name: snowflake-sqlalchemy
  version: 2.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/snowflake_sqlalchemy-${{ version }}.tar.gz
  sha256: 0f854dd1d740305b856ab21207df49e18f8618403d124fe4093c258bdfd987e4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - sqlalchemy >=2.0.44,<2.2
    - snowflake-connector-python >=5.1.0,<6.0
tests:
  - python:
      imports:
        - snowflake.sqlalchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Snowflake SQLAlchemy Dialect
  homepage: https://github.com/snowflakedb/snowflake-sqlalchemy

extra:
  recipe-maintainers:
    - xhochy
    - xylar
