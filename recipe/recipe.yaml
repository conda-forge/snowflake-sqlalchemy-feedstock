schema_version: 1

context:
  name: snowflake-sqlalchemy
  version: 2.0.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/snowflake_sqlalchemy-${{ version }}.tar.gz
  sha256: d80bfaf9ac7942aec46df951fb76552089114e7299227895746ea6da98830342

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - sqlalchemy >=2.0.44,<2.1
    - snowflake-connector-python >=5.0.0
tests:
  - python:
      imports:
        - snowflake.sqlalchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Snowflake SQLAlchemy Dialect
  homepage: https://github.com/snowflakedb/snowflake-sqlalchemy

extra:
  recipe-maintainers:
    - xhochy
    - xylar
